[package]
name = "skillspec-source"
version = "0.2.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Internal source-package reading modules for the SkillSpec CLI"

[dependencies]
skillspec-core = { version = "0.2.2", path = "../skillspec-core" }
markdown = { version = "1.0.0", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
